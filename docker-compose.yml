x-hard: &hard
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
x-env: &env
  DATABASE_URL: "postgresql://postgres:${PG_PASSWORD}@postgres/flowlab"
  REDIS_URL: "redis://redis:6379"
  FIELD_KEY_HEX: "${FIELD_KEY_HEX:?64 hex chars}"
  KAFKA: "kafka:9092"
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD}", POSTGRES_DB: flowlab}
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro", "pg:/var/lib/postgresql/data"]
  redis: {image: "redis:7-alpine"}
  zookeeper: {image: "confluentinc/cp-zookeeper:7.6.0", environment: {ZOOKEEPER_CLIENT_PORT: 2181}}
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment: {KAFKA_BROKER_ID: 1, KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092", KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1}
  backend:
    <<: *hard
    build: ./backend
    depends_on: [postgres, redis, kafka]
    environment: *env
  agents:
    <<: *hard
    build: ./backend
    command: uvicorn agentic_rag_service:app --host 0.0.0.0 --port 8001
    environment: {<<: *env, GROQ_API_KEY: "${GROQ_API_KEY}", ENV: "${ENV:-dev}"}
    ports: ["127.0.0.1:8001:8001"]
  cnn-worker:
    <<: *hard
    build: ./backend
    command: python cnn_worker.py
    volumes: ["./models:/models:ro"]
    environment: *env
    mem_limit: 2g
    cpus: 1.5
  web:
    image: nginx:alpine
    volumes: ["./index.html:/usr/share/nginx/html/index.html:ro"]
    ports: ["127.0.0.1:8080:80"]
volumes: {pg: {}}
